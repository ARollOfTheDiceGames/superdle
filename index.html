<!DOCTYPE html>
<html>
<head>
<style>
	body {
    	font-family: Verdana, sans-serif;
        background-image: url("images (10).jpeg");
        margin: 0;
        padding: 40px 20px;
        text-align: center;
		color: white;
    }
	h1 {
		color: white;
	}
</style>
</head>
<body>
    <div class="game">

        <h1>Superdle</h1>
        <h3>The daily hero game.</h3>
        <p>Guess the comic book hero based on abilities and powers!</p>

        <form id="quizForm">

            <div class="sequence">
            guess your hero here!
            </div>

            <input
                type="text"
                id="answer"
                placeholder="Enter your guess here!"
                autocomplete="off"
                required
            >

            <button type="submit">Submit Answer</button>

            <p id="feedback" class="feedback" aria-live="polite"></p>

        </form>

    </div>
	<script>
		import readline from 'node:readline/promises';
import { stdin as input, stdout as output } from 'node:process';

const rl = readline.createInterface({ input, output });

const answer = 'superman';

const hints = [
  'incorrect. Hint 1- one of their powers is super speed.',
  'incorrect. Hint 2- one of their powers is heat vision.',
  'incorrect. hint 3- one of their powers is flight.',
];

let userAnswer = await rl.question('guess the hero');

if (userAnswer === answer) {
  console.log('wow! great job!');
} else {
  let won = false;
  for (const hint of hints) {
    userAnswer = await rl.question(hint);
    if (userAnswer === answer) {
      console.log('wow! great job!');
      won = true;
      break;
    }
  }
  if (!won) {
    console.log('You lost. The answer was SUPERMAN');
  }
}

rl.close();
		
    </script>
</body>
</html>
